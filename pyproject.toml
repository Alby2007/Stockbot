[project]
name = "stockbot"
version = "0.1.0"
description = "Global Discord synthetic stock market bot"
requires-python = ">=3.13,<3.14"
dependencies = [
    "discord.py==2.7.1",
    "psycopg[binary,pool]==3.3.4",
    "numpy==2.3.3",
    "matplotlib==3.10.6",
    "scipy==1.16.2",
    "pydantic-settings==2.10.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==0.26.0",
    "ruff==0.13.1",
    "mypy==1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = false

[[tool.mypy.overrides]]
module = ["stockbot.ledger.*", "stockbot.market.*", "stockbot.margin.*"]
strict = true
