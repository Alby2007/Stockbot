name: deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: stockbot
          POSTGRES_PASSWORD: stockbot
          POSTGRES_DB: stockbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockbot -d stockbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://stockbot:stockbot@localhost:5432/stockbot
      TEST_DATABASE_URL: postgresql://stockbot:stockbot@localhost:5432/stockbot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      # conftest applies migrations itself; the suite just needs the db to exist.
      - name: Create test database
        run: psql "$DATABASE_URL" -c "CREATE DATABASE stockbot_test"
      - run: python -m pytest -x -q
      - run: ruff check
      - run: mypy src

  deploy:
    # The VM only ever receives a green commit: `needs` pins deploy to the
    # same SHA's test run, so a broken push can't reach production.
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The repo is private, so the VM can't fetch it itself: package the
      # checked-out SHA in the runner (which already has auth) and scp it.
      - uses: actions/checkout@v4
      - name: Deploy to VM
        env:
          VM_HOST: ${{ secrets.STOCKBOT_VM_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STOCKBOT_VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Write the tarball outside the checkout: archiving `.` while
          # the output file lives inside it makes tar abort with "file
          # changed as we read it".
          tar --exclude=.git -czf "$RUNNER_TEMP/release.tar.gz" .
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
            "$RUNNER_TEMP/release.tar.gz" \
            opc@"$VM_HOST":/tmp/stockbot-release.tar.gz
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key opc@"$VM_HOST" '
            set -e
            mkdir -p ~/stockbot ~/stockbot-release
            tar xzf /tmp/stockbot-release.tar.gz -C ~/stockbot-release
            # rsync --delete so files removed from the repo disappear on the
            # VM too; .env (VM-only secrets) is preserved. cp -a fallback is
            # an overlay if the image lacks rsync.
            rsync -a --delete --exclude=.env ~/stockbot-release/ ~/stockbot/ \
              2>/dev/null || cp -a ~/stockbot-release/. ~/stockbot/
            rm -rf ~/stockbot-release /tmp/stockbot-release.tar.gz
            cd ~/stockbot
            # Rebuilds accumulate dangling image layers + build cache; the
            # disk filled once already ("no space left on device" mid-pull).
            # image/builder prune never touch running containers, volumes,
            # or the postgres data volume -- only unused images and cache.
            docker image prune -af >/dev/null 2>&1 || true
            docker builder prune -af >/dev/null 2>&1 || true
            docker compose up -d --build postgres bot market npc backup
          '
