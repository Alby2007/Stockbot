services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: stockbot
      # Set POSTGRES_PASSWORD in .env for any real deployment -- and do it
      # BEFORE the first boot: Postgres only applies it when initializing
      # an empty data dir, so changing it on an existing volume is a no-op
      # (use ALTER ROLE there instead).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockbot}
      POSTGRES_DB: stockbot
    ports:
      # Localhost-only: the other services reach Postgres over the compose
      # network, so this mapping exists purely for local psql/tests and
      # must never be publicly reachable on the VM. Host port 5450 avoids
      # this machine's native Postgres services on 5432/5433.
      - "127.0.0.1:5450:5432"
    volumes:
      - stockbot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockbot -d stockbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["python", "-m", "stockbot.migrate"]
    environment:
      DATABASE_URL: postgresql://stockbot:${POSTGRES_PASSWORD:-stockbot}@postgres:5432/stockbot
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build: .
    command: ["python", "-m", "stockbot.bot.main"]
    environment:
      DATABASE_URL: postgresql://stockbot:${POSTGRES_PASSWORD:-stockbot}@postgres:5432/stockbot
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  market:
    build: .
    command: ["python", "-m", "stockbot.market.main"]
    environment:
      DATABASE_URL: postgresql://stockbot:${POSTGRES_PASSWORD:-stockbot}@postgres:5432/stockbot
      # MUST be a real secret before the first tick: the entire price
      # history is HMAC(master_seed, tick)-derived, so the default makes
      # the market predictable, and rotating it later forks history.
      MASTER_SEED: ${MASTER_SEED:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  npc:
    build: .
    command: ["python", "-m", "stockbot.npc.main"]
    environment:
      DATABASE_URL: postgresql://stockbot:${POSTGRES_PASSWORD:-stockbot}@postgres:5432/stockbot
      # Same seed as market: per-agent decision RNG is keyed off it.
      MASTER_SEED: ${MASTER_SEED:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Daily pg_dump into a named volume -- trivial to have, painful to learn
  # you needed. Restore: `docker compose exec backup ls /backups`, copy the
  # .sql.gz out, `gunzip | psql`.
  backup:
    image: postgres:17-alpine
    environment:
      DATABASE_URL: postgresql://stockbot:${POSTGRES_PASSWORD:-stockbot}@postgres:5432/stockbot
    command:
      - sh
      - -c
      - |
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S)
          pg_dump -Fc "$$DATABASE_URL" \
            -f "/backups/stockbot-$$ts.dump" && \
          find /backups -name 'stockbot-*.dump' -mtime +14 -delete
          sleep 86400
        done
    volumes:
      - stockbot-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  stockbot-postgres-data:
  stockbot-backups:
